name: Host tests

# The host-side unit tests (standard-library-only code, no ESP-IDF needed):
# the device-config protocol encoding and the input mapping.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  host_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Device config protocol test
      run: |
        c++ -std=c++20 -Wall -Wextra -Werror -I components/device_config/include \
          components/device_config/test/device_config_host_test.cpp -o dc_test
        ./dc_test

    - name: Input mapping test
      run: |
        c++ -std=c++20 -Wall -Wextra -Werror \
          -I components/input_mapping/include -I components/gamepad_inputs/include \
          components/input_mapping/test/input_mapping_host_test.cpp -lm -o im_test
        ./im_test
